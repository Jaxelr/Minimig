version: '0.12.0.{build}'
image: Visual Studio 2022
branches:
  only:
  - master
init:
  - cmd: git config --global core.autocrlf true
  - cmd: net start MSSQL$SQL2019
  - ps: Start-Service MySQL80
configuration:
  - Release
services:
  - postgresql13
nuget:
  disable_publish_on_pr: true
install:
- ps: |
    Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -UseBasicParsing -OutFile "$env:temp\dotnet-install.ps1"
    & $env:temp\dotnet-install.ps1 -Architecture x64 -Version '10.0.110' -InstallDir "$env:ProgramFiles\dotnet"
before_build:
  - cmd: dotnet --version
  - choco install codecov
build_script:
  - cmd: dotnet build . -v quiet
test_script:
  - cmd: dotnet test ./tests/MinimigTests.csproj --framework net10.0 --coverlet --coverlet-output-format cobertura
after_test:
  - ps: |
      $coverageFile = Get-ChildItem -Path ".\TestResults" -Filter "coverage.cobertura.*.xml" -Recurse | Select-Object -First 1 -ExpandProperty FullName
      codecov -f "$coverageFile" -t $(codecov_token)
environment:
  sql_connection: Server=(local)\SQL2019;Database=master;User ID=sa;Password=Password12!;TrustServerCertificate=True;
  postgres_connection: Server=localhost;Port=5432;Database=postgres;Username=postgres;Password=Password12!;
  mysql_connection: Server=localhost;Port=3306;Database=mysql;User Id=root;Password=Password12!;SSL Mode=Required;
  codecov_token:
    secure: lUmWvr1PcJnFJ7tR5/Y+fpuIPkc0L822Dh/NQy6EACQHZa/KY//Vwkap4lZg3yAN
artifacts:
  - path: '**/*.nupkg'
skip_commits:
  files:
    - '**/*.md'
deploy:
- provider: NuGet
  server: https://www.myget.org/F/minimig/api/v2/package
  on:
    branch: master
    appveyor_repo_tag: true
  api_key:
    secure: 6xhHSsDvB9arsrSDLuynnbxaVS+BwaoJU96RfQenc5FOnUYvP8SHM6kbvrmpvja2
  skip_symbols: true
